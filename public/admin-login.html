<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yzemanbot Admin Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1220;color:#f8fafc;font-family:Arial,sans-serif;padding:20px}.panel{width:min(100%,390px);background:#151f32;border:1px solid #29364d;border-radius:18px;padding:28px}h1{font-size:23px;margin:0 0 8px}p{color:#a9b7ca;line-height:1.5;font-size:14px}label{display:block;margin:22px 0 8px;font-size:13px}input{width:100%;padding:14px;border:1px solid #40516c;border-radius:10px;background:#0c1628;color:white;font-size:16px}button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:10px;background:#2563eb;color:white;font-weight:700;font-size:15px}#error{color:#fca5a5;min-height:20px;font-size:13px;margin-top:12px}</style></head><body><main class="panel"><h1>Yzemanbot Admin</h1><p>Sign in once to access the admin panel and analytics.</p><form id="loginForm"><label for="password">Admin password</label><input id="password" type="password" autocomplete="current-password" required autofocus><button id="submit" type="submit">Sign in</button><div id="error" role="alert"></div></form></main><script>const f=document.getElementById('loginForm'),b=document.getElementById('submit'),e=document.getElementById('error');f.addEventListener('submit',async ev=>{ev.preventDefault();b.disabled=true;b.textContent='Signing in…';e.textContent='';try{const q=new URLSearchParams(location.search),next=q.get('next')==='/analytics.html'?'/analytics.html':'/yzeadmin.html';const r=await fetch('/api/admin/auth/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value,next})});const d=await r.json();if(!r.ok)throw Error(d.error||'Sign-in failed');location.replace(d.next||next);}catch(x){e.textContent=x.message;b.disabled=false;b.textContent='Sign in';}});</script></body></html>
