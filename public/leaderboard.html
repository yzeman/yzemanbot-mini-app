<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Leaderboard - YzemanBot</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #4CAF50;
            --secondary: #2196F3;
            --warning: #FF9800;
            --danger: #f44336;
            --dark: #1a1a2e;
            --darker: #16213e;
            --light: #ffffff;
            --gray: #888888;
            --gold: #FFD700;
            --silver: #C0C0C0;
            --bronze: #CD7F32;
            --success: #00c853;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, #0f0f1a 100%);
            color: var(--light);
            min-height: 100vh;
            padding-bottom: 80px;
            overflow-x: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1a 100%);
            padding: 20px 15px 25px;
            border-radius: 0 0 30px 30px;
            text-align: center;
            position: relative;
            border-bottom: 1px solid rgba(255,215,0,0.2);
        }
        .header h1 {
            font-size: 24px;
            margin-bottom: 6px;
            background: linear-gradient(135deg, var(--gold), #FFA000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header h1 i { color: var(--gold); -webkit-text-fill-color: var(--gold); }
        .header p { color: var(--gray); font-size: 12px; margin-bottom: 8px; }
        
        .back-btn-header {
            position: absolute; top: 18px; left: 18px;
            color: white; font-size: 20px;
            text-decoration: none; z-index: 10;
            background: rgba(0,0,0,0.3);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Prize Banner - COLLAPSIBLE */
        .prize-banner {
            background: linear-gradient(135deg, rgba(255,215,0,0.12), rgba(255,160,0,0.08));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,215,0,0.2);
            border-radius: 16px;
            margin: 12px 15px;
            overflow: hidden;
        }
        
        .prize-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            cursor: pointer;
            background: rgba(0,0,0,0.2);
        }
        
        .prize-header h3 {
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--gold);
        }
        
        .toggle-icon {
            font-size: 13px;
            color: var(--gray);
            transition: transform 0.3s;
        }
        
        .prize-header.collapsed .toggle-icon {
            transform: rotate(180deg);
        }
        
        .prize-content {
            padding: 12px 15px;
            max-height: 200px;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
        }
        
        .prize-content.collapsed {
            max-height: 0;
            padding: 0 15px;
        }
        
        .prize-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        
        .prize-card {
            background: linear-gradient(135deg, rgba(0,0,0,0.3), rgba(0,0,0,0.1));
            border-radius: 12px;
            padding: 10px 5px;
            text-align: center;
        }
        
        .prize-position { font-size: 24px; margin-bottom: 3px; }
        .prize-amount { font-size: 14px; font-weight: bold; color: var(--gold); }
        .prize-label { font-size: 9px; opacity: 0.7; margin-top: 2px; }
        
        .reward-info {
            background: rgba(33,150,243,0.1);
            border-left: 3px solid var(--secondary);
            border-radius: 12px;
            padding: 10px 12px;
            margin: 0 15px 12px;
            font-size: 11px;
            color: var(--gray);
        }
        .reward-info i { color: var(--secondary); margin-right: 6px; }
        
        /* Button Row */
        .button-row {
            display: flex;
            gap: 10px;
            padding: 0 15px 12px;
        }
        .action-btn {
            flex: 1;
            background: var(--darker);
            color: var(--gray);
            border: none;
            padding: 10px 8px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .action-btn i { font-size: 13px; }
        .action-btn.active {
            background: linear-gradient(135deg, var(--primary), #2E7D32);
            color: white;
            box-shadow: 0 2px 8px rgba(76,175,80,0.3);
        }
        
        /* Tier Selector */
        .tier-selector {
            padding: 0 15px 12px;
            display: none;
        }
        .tier-selector.show { display: block; }
        .tier-select-btn {
            background: var(--darker);
            color: white;
            border: 1px solid var(--gray);
            padding: 10px 15px;
            border-radius: 30px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        .tier-dropdown-menu {
            background: var(--darker);
            border: 1px solid var(--gray);
            border-radius: 14px;
            margin-top: 5px;
            display: none;
        }
        .tier-dropdown-menu.show { display: block; }
        .tier-option {
            padding: 12px 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        .tier-option:hover { background: rgba(255,255,255,0.1); }
        .tier-option.active { background: var(--primary); color: white; }
        .tier-icon { width: 10px; height: 10px; border-radius: 50%; }
        
        /* Leaderboard Container */
        .leaderboard-container {
            padding: 0 15px 20px;
        }
        .section-title {
            font-size: 14px;
            font-weight: 600;
            margin: 10px 0 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--gray);
        }
        .section-title i { color: var(--gold); font-size: 15px; }
        
        .leaderboard-list {
            max-height: 450px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .leaderboard-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            background: rgba(22, 33, 62, 0.8);
            backdrop-filter: blur(5px);
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .leaderboard-item.current-user {
            background: linear-gradient(135deg, rgba(76,175,80,0.2), rgba(0,200,83,0.1));
            border: 1px solid var(--gold);
        }
        
        .rank-badge {
            width: 40px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            margin-right: 8px;
            flex-shrink: 0;
        }
        .medal-badge {
            font-size: 26px;
            width: 40px;
            text-align: center;
            margin-right: 8px;
            flex-shrink: 0;
        }
        
        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            margin-right: 10px;
            color: white;
            font-weight: bold;
            flex-shrink: 0;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        
        .info {
            flex: 1;
            min-width: 0;
        }
        .name-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
            flex-wrap: wrap;
        }
        .name {
            font-weight: 600;
            font-size: 14px;
        }
        .tier-badge {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 9px;
            font-weight: 600;
            color: var(--dark);
        }
        .you-badge {
            background: var(--gold);
            color: var(--dark);
            padding: 2px 6px;
            border-radius: 12px;
            font-size: 8px;
            font-weight: bold;
        }
        .tier-Fresher .tier-badge { background: #888; }
        .tier-Brute .tier-badge { background: #FF9800; }
        .tier-Silver .tier-badge { background: #C0C0C0; }
        .tier-Gold .tier-badge { background: #FFD700; }
        .tier-Platinum .tier-badge { background: #E5E4E2; }
        
        .stats-row {
            display: flex;
            gap: 12px;
            font-size: 10px;
            color: var(--gray);
        }
        .stats-row i { margin-right: 3px; width: 12px; font-size: 10px; }
        
        .score {
            font-weight: bold;
            color: var(--gold);
            font-size: 14px;
            text-align: right;
            min-width: 70px;
            flex-shrink: 0;
        }
        .score small {
            font-size: 8px;
            color: var(--gray);
            font-weight: normal;
        }
        
        /* My Rank Card - STICKY */
        .sticky-rank-container {
            position: sticky;
            top: 0;
            z-index: 50;
            margin: 0 15px 12px;
        }
        .my-rank-card {
            background: linear-gradient(135deg, var(--secondary), #0D47A1);
            border-radius: 16px;
            padding: 14px 16px;
            box-shadow: 0 4px 15px rgba(33,150,243,0.3);
            border: 1px solid rgba(255,255,255,0.15);
        }
        .my-rank-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .my-rank-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }
        .my-rank-info h4 {
            font-size: 11px;
            color: rgba(255,255,255,0.8);
            margin-bottom: 3px;
        }
        .my-rank-value {
            font-size: 30px;
            font-weight: bold;
            background: linear-gradient(135deg, var(--gold), #FFA000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .my-rank-right {
            margin-left: auto;
            text-align: right;
        }
        .my-rank-coins {
            font-size: 18px;
            font-weight: bold;
        }
        .my-rank-label {
            font-size: 9px;
            color: rgba(255,255,255,0.7);
        }
        
        .loading, .empty-state { text-align: center; padding: 30px; color: var(--gray); font-size: 13px; }
        .retry-btn {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(22, 33, 62, 0.95);
            backdrop-filter: blur(10px);
            display: flex; padding: 8px 12px;
            border-top: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }
        .nav-item {
            flex: 1; text-align: center; color: var(--gray);
            text-decoration: none; font-size: 10px; padding: 5px;
            border-radius: 8px;
        }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 2px; }
        .nav-item.active { color: var(--primary); background: rgba(76,175,80,0.12); }
        
        .notification {
            position: fixed; bottom: 80px; left: 15px; right: 15px;
            background: var(--success); color: white; padding: 12px 16px;
            border-radius: 12px; text-align: center; display: none; z-index: 1000;
            font-size: 12px;
        }
        .notification.error { background: var(--danger); }
        .rank-movement { display:inline-flex; align-items:center; margin-left:5px; font-size:10px; font-weight:700; }
        .rank-movement.up { color:#00e676; }
        .rank-movement.down { color:#ff6b6b; }
        .rank-movement.same { color:rgba(255,255,255,.45); }
        .leaderboard-meta { text-align:center; color:var(--gray); font-size:10px; padding:8px 4px 12px; }
        
        /* Tier border colors */
        .leaderboard-item.tier-Fresher { border-left: 3px solid #888; }
        .leaderboard-item.tier-Brute { border-left: 3px solid #FF9800; }
        .leaderboard-item.tier-Silver { border-left: 3px solid #C0C0C0; }
        .leaderboard-item.tier-Gold { border-left: 3px solid #FFD700; }
        .leaderboard-item.tier-Platinum { border-left: 3px solid #E5E4E2; }
    </style>
</head>
<body>
    <a href="/" class="back-btn-header"><i class="fas fa-arrow-left"></i></a>
    
    <div class="header">
        <h1><i class="fas fa-trophy"></i> Leaderboard</h1>
        <p>Compete globally and climb the ranks!</p>
    </div>
    
    <!-- Collapsible Prize Banner -->
    <div class="prize-banner" id="prizeBanner">
        <div class="prize-header" id="prizeToggle">
            <h3 id="prizeTitle"><i class="fas fa-crown"></i> Monthly Prizes</h3>
            <i class="fas fa-chevron-up toggle-icon" id="toggleIcon"></i>
        </div>
        <div class="prize-content" id="prizeContent">
            <div class="prize-grid" id="prizeGrid">
                <div class="prize-card">
    <div class="prize-position">🥇</div>
    <div class="prize-amount">20,000</div>
    <div class="prize-label">COINS</div>
</div>
<div class="prize-card">
    <div class="prize-position">🥈</div>
    <div class="prize-amount">10,000</div>
    <div class="prize-label">COINS</div>
</div>
<div class="prize-card">
    <div class="prize-position">🥉</div>
    <div class="prize-amount">5,000</div>
    <div class="prize-label">COINS</div>
</div>
            </div>
        </div>
    </div>
    
    <div class="reward-info" id="rewardInfo">
        <i class="fas fa-info-circle"></i>
        <span id="rewardInfoText">Distributed on the 1st of every month to top 3 earners</span>
    </div>
    
    <!-- Button Row -->
    <div class="button-row">
        <button class="action-btn active" data-view="earnings"><i class="fas fa-coins"></i> Top Earnings</button>
        <button class="action-btn" data-view="referrals"><i class="fas fa-users"></i> Top Referrals</button>
        <button class="action-btn" data-view="tier"><i class="fas fa-layer-group"></i> Tier</button>
    </div>
    
    <!-- Tier Selector -->
    <div class="tier-selector" id="tierSelector">
        <button class="tier-select-btn" id="tierSelectBtn">
            <span><i class="fas fa-filter"></i> <span id="selectedTierText">All Tiers</span></span>
            <i class="fas fa-chevron-down"></i>
        </button>
        <div class="tier-dropdown-menu" id="tierDropdown">
            <div class="tier-option active" data-tier="all"><span class="tier-icon" style="background: var(--gold);"></span> All Tiers</div>
            <div class="tier-option" data-tier="Fresher"><span class="tier-icon" style="background: #888;"></span> Fresher</div>
            <div class="tier-option" data-tier="Brute"><span class="tier-icon" style="background: #FF9800;"></span> Brute</div>
            <div class="tier-option" data-tier="Silver"><span class="tier-icon" style="background: #C0C0C0;"></span> Silver</div>
            <div class="tier-option" data-tier="Gold"><span class="tier-icon" style="background: #FFD700;"></span> Gold</div>
            <div class="tier-option" data-tier="Platinum"><span class="tier-icon" style="background: #E5E4E2;"></span> Platinum</div>
        </div>
    </div>
    
    <!-- Leaderboard Container -->
    <div class="leaderboard-container">
        <div class="section-title" id="listTitle">
            <i class="fas fa-list-ol"></i> Monthly Rankings
        </div>
        <div class="leaderboard-list" id="leaderboardList">
            <div class="loading">Loading rankings...</div>
        </div>
    </div>
    
    <!-- My Rank Card - STICKY -->
    <div class="sticky-rank-container" id="stickyRankContainer">
        <div id="myRankContainer"></div>
    </div>
    
    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <a href="/" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="/daily.html" class="nav-item"><i class="fas fa-calendar-check"></i><span>Daily</span></a>
        <a href="/wheel.html" class="nav-item"><i class="fas fa-dharmachakra"></i><span>Wheel</span></a>
        <a href="/leaderboard.html" class="nav-item active"><i class="fas fa-trophy"></i><span>Ranks</span></a>
        <a href="/team.html" class="nav-item"><i class="fas fa-users"></i><span>Team</span></a>
    </div>
    
    <div class="notification" id="notification"></div>
    
    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        let currentView = 'earnings';
        let currentTier = 'all';
        let prizeBannerCollapsed = false;
        let refreshTimer = null;
        let isLoading = false;
        let previousRanks = new Map();
        let previousMyRank = new Map();
        let latestData = null;

        try { prizeBannerCollapsed = localStorage.getItem('leaderboardBannerCollapsed') === 'true'; } catch (_) {}

        function showNotification(message, isError = false) {
            const node = document.getElementById('notification');
            node.textContent = message;
            node.className = 'notification' + (isError ? ' error' : '');
            node.style.display = 'block';
            window.setTimeout(() => { node.style.display = 'none'; }, 3000);
        }
        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
        }
        function safePhotoUrl(value) {
            if (typeof value !== 'string' || !value.trim()) return '';
            try { const url = new URL(value); return url.protocol === 'https:' ? url.href : ''; } catch (_) { return ''; }
        }
        function validTier(value) {
            return ['Fresher','Brute','Silver','Gold','Platinum'].includes(value) ? value : 'Fresher';
        }
        function formatNumber(value) {
            const number = Number(value || 0);
            return Number.isFinite(number) ? number.toLocaleString(undefined, {maximumFractionDigits:2}) : '0';
        }
        function rankDisplay(rank) {
            return rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '#' + rank;
        }
        async function apiCall(endpoint, extraData = {}) {
            if (!tg?.initData) throw new Error('Open this page inside Telegram to view the leaderboard.');
            const response = await fetch(endpoint, {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({initData:tg.initData, ...extraData}),
                cache:'no-store'
            });
            let data;
            try { data = await response.json(); } catch (_) { throw new Error('The server returned an unreadable response.'); }
            if (!response.ok) throw new Error(data.error || 'Could not load leaderboard.');
            return data;
        }
        function togglePrizeBanner() {
            prizeBannerCollapsed = !prizeBannerCollapsed;
            try { localStorage.setItem('leaderboardBannerCollapsed', String(prizeBannerCollapsed)); } catch (_) {}
            document.getElementById('prizeContent').classList.toggle('collapsed', prizeBannerCollapsed);
            document.getElementById('prizeToggle').classList.toggle('collapsed', prizeBannerCollapsed);
            document.getElementById('toggleIcon').className = 'fas ' + (prizeBannerCollapsed ? 'fa-chevron-down' : 'fa-chevron-up') + ' toggle-icon';
        }
        function updatePrizeDisplay() {
            const title = document.getElementById('prizeTitle');
            const grid = document.getElementById('prizeGrid');
            const info = document.getElementById('rewardInfoText');
            if (currentView === 'earnings') {
                title.textContent = '👑 Monthly Prizes';
                grid.innerHTML = '<div class="prize-card"><div class="prize-position">🥇</div><div class="prize-amount">20,000</div><div class="prize-label">COINS</div></div><div class="prize-card"><div class="prize-position">🥈</div><div class="prize-amount">10,000</div><div class="prize-label">COINS</div></div><div class="prize-card"><div class="prize-position">🥉</div><div class="prize-amount">5,000</div><div class="prize-label">COINS</div></div>';
                info.textContent = 'Distributed on the 1st of every month to top 3 earners';
            } else if (currentView === 'referrals') {
                title.textContent = '👑 Weekly Prizes';
                grid.innerHTML = '<div class="prize-card"><div class="prize-position">🥇</div><div class="prize-amount">10,000</div><div class="prize-label">COINS</div></div><div class="prize-card"><div class="prize-position">🥈</div><div class="prize-amount">5,000</div><div class="prize-label">COINS</div></div><div class="prize-card"><div class="prize-position">🥉</div><div class="prize-amount">2,500</div><div class="prize-label">COINS</div></div>';
                info.textContent = 'Distributed every Sunday to top 3 referrers';
            } else {
                title.textContent = '🏆 Tier Rankings';
                grid.innerHTML = '<div class="prize-card"><div class="prize-position">🏆</div><div class="prize-amount">Top 3</div><div class="prize-label">Per Tier</div></div><div class="prize-card"><div class="prize-position">📊</div><div class="prize-amount">Rankings</div><div class="prize-label">By Tier</div></div><div class="prize-card"><div class="prize-position">🎯</div><div class="prize-amount">Compete</div><div class="prize-label">Within Tier</div></div>';
                info.textContent = 'See how you rank within your selected tier';
            }
        }
        function movementFor(user, view, tier) {
            const key = view + ':' + tier + ':' + String(user.telegram_id);
            const rank = Number(user.rank);
            const previous = previousRanks.get(key);
            previousRanks.set(key, rank);
            if (!previous || previous === rank) return '<span class="rank-movement same">—</span>';
            const change = previous - rank;
            return change > 0
                ? '<span class="rank-movement up">↑ ' + change + '</span>'
                : '<span class="rank-movement down">↓ ' + Math.abs(change) + '</span>';
        }
        function renderLeaderboard(rows) {
            const container = document.getElementById('leaderboardList');
            if (!Array.isArray(rows) || rows.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-users"></i><p>No users yet.</p></div>';
                return;
            }
            container.innerHTML = rows.map(user => {
                const tier = validTier(user.tier);
                const name = String(user.first_name || 'Anonymous User');
                const shortName = name.length > 18 ? name.slice(0,15) + '...' : name;
                const photo = safePhotoUrl(user.photo_url);
                const rank = Number(user.rank) || 0;
                const userId = tg?.initDataUnsafe?.user?.id;
                const isMe = userId != null && String(user.telegram_id) === String(userId);
                const score = currentView === 'referrals'
                    ? formatNumber(user.referral_count) + ' <small>refs</small>'
                    : formatNumber(user.monthly_coins) + ' <small>COINS</small>';
                const avatar = photo
                    ? '<img src="' + escapeHtml(photo) + '" alt="' + escapeHtml(shortName) + '" loading="lazy" referrerpolicy="no-referrer">'
                    : escapeHtml(shortName.charAt(0).toUpperCase() || '👤');
                return '<div class="leaderboard-item tier-' + tier + (isMe ? ' current-user' : '') + '">' +
                    '<div class="' + (rank <= 3 ? 'medal-badge' : 'rank-badge') + '">' + rankDisplay(rank) + '</div>' +
                    '<div class="avatar">' + avatar + '</div><div class="info"><div class="name-row">' +
                    '<span class="name">' + escapeHtml(shortName) + '</span><span class="tier-badge">' + tier + '</span>' +
                    (isMe ? '<span class="you-badge">YOU</span>' : '') + movementFor(user, currentView, currentTier) +
                    '</div></div><div class="score">' + score + '</div></div>';
            }).join('');
        }
        function renderMyRank(user) {
            const container = document.getElementById('myRankContainer');
            if (!user) {
                container.innerHTML = '<div class="my-rank-card"><div class="my-rank-left"><div class="my-rank-icon"><i class="fas fa-user"></i></div><div class="my-rank-info"><h4>YOUR ACTUAL RANK</h4><div class="my-rank-value">—</div></div></div><div class="my-rank-right"><div class="my-rank-coins">Not ranked</div><div class="my-rank-label">No matching tier</div></div></div>';
                return;
            }
            const key = currentView + ':' + currentTier;
            const rank = Number(user.rank) || 0;
            const oldRank = previousMyRank.get(key);
            previousMyRank.set(key, rank);
            const delta = oldRank ? oldRank - rank : 0;
            const movement = delta > 0 ? '<span class="rank-movement up">↑ ' + delta + '</span>' : delta < 0 ? '<span class="rank-movement down">↓ ' + Math.abs(delta) + '</span>' : '<span class="rank-movement same">—</span>';
            const score = currentView === 'referrals' ? formatNumber(user.referral_count) : formatNumber(user.monthly_coins);
            const label = currentView === 'referrals' ? 'WEEKLY REFERRALS' : 'MONTHLY COINS';
            container.innerHTML = '<div class="my-rank-card"><div class="my-rank-left"><div class="my-rank-icon"><i class="fas fa-user"></i></div><div class="my-rank-info"><h4>YOUR ACTUAL RANK ' + movement + '</h4><div class="my-rank-value">' + rankDisplay(rank) + '</div></div></div><div class="my-rank-right"><div class="my-rank-coins">' + score + '</div><div class="my-rank-label">' + label + '</div></div></div>';
        }
        function renderMeta(data) {
            let node = document.getElementById('leaderboardMeta');
            if (!node) {
                node = document.createElement('div');
                node.id = 'leaderboardMeta';
                node.className = 'leaderboard-meta';
                document.getElementById('leaderboardList').after(node);
            }
            const updated = data.updatedAt ? new Date(data.updatedAt).toLocaleTimeString() : new Date().toLocaleTimeString();
            node.textContent = Number(data.total || 0).toLocaleString() + ' players · Updated ' + updated + ' · refreshes every 10 seconds';
        }
        async function loadBoard(silent = false) {
            if (isLoading) return;
            isLoading = true;
            const list = document.getElementById('leaderboardList');
            if (!silent) list.innerHTML = '<div class="loading">Loading rankings...</div>';
            const endpoint = currentView === 'referrals' ? '/api/leaderboard/weekly-referrers' : '/api/leaderboard/top-earners';
            try {
                const data = await apiCall(endpoint, {tier: currentView === 'tier' ? currentTier : 'all'});
                latestData = data;
                renderLeaderboard(data.rows || []);
                renderMyRank(data.myRank || null);
                renderMeta(data);
            } catch (error) {
                console.error('Leaderboard loading error:', error);
                if (!silent || !list.children.length) {
                    list.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>' + escapeHtml(error.message || 'Failed to load leaderboard') + '</p><button class="retry-btn" id="retryLeaderboard" type="button">Retry</button></div>';
                    document.getElementById('retryLeaderboard').addEventListener('click', () => loadBoard(false));
                } else {
                    showNotification('Could not refresh. Showing previous results.', true);
                }
            } finally {
                isLoading = false;
            }
        }
        function switchView(view) {
            currentView = view;
            document.querySelectorAll('.action-btn').forEach(button => button.classList.toggle('active', button.dataset.view === view));
            document.getElementById('tierSelector').classList.toggle('show', view === 'tier');
            document.getElementById('listTitle').innerHTML = view === 'referrals'
                ? '<i class="fas fa-list-ol"></i> Weekly Referral Rankings'
                : view === 'tier' ? '<i class="fas fa-list-ol"></i> Rankings by Tier' : '<i class="fas fa-list-ol"></i> Monthly Rankings';
            updatePrizeDisplay();
            loadBoard(false);
        }
        function switchTier(tier) {
            currentTier = tier;
            document.querySelectorAll('.tier-option').forEach(option => option.classList.toggle('active', option.dataset.tier === tier));
            document.getElementById('selectedTierText').textContent = tier === 'all' ? 'All Tiers' : tier;
            document.getElementById('tierDropdown').classList.remove('show');
            loadBoard(false);
        }
        function startAutoRefresh() {
            if (refreshTimer) window.clearInterval(refreshTimer);
            refreshTimer = window.setInterval(() => {
                if (!document.hidden) loadBoard(true);
            }, 10000);
        }

        document.querySelectorAll('.action-btn').forEach(button => button.addEventListener('click', () => switchView(button.dataset.view)));
        document.getElementById('tierSelectBtn').addEventListener('click', event => {
            event.stopPropagation();
            document.getElementById('tierDropdown').classList.toggle('show');
        });
        document.querySelectorAll('.tier-option').forEach(option => option.addEventListener('click', event => {
            event.stopPropagation();
            switchTier(option.dataset.tier);
        }));
        document.addEventListener('click', () => document.getElementById('tierDropdown').classList.remove('show'));
        document.getElementById('prizeToggle').addEventListener('click', togglePrizeBanner);
        if (prizeBannerCollapsed) {
            document.getElementById('prizeContent').classList.add('collapsed');
            document.getElementById('prizeToggle').classList.add('collapsed');
            document.getElementById('toggleIcon').className = 'fas fa-chevron-down toggle-icon';
        }
        document.addEventListener('visibilitychange', () => { if (!document.hidden) loadBoard(true); });
        document.addEventListener('DOMContentLoaded', () => { updatePrizeDisplay(); loadBoard(false); startAutoRefresh(); });
    </script>
</body>
</html>
