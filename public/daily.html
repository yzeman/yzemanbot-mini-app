<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Daily Rewards - YzemanBot</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- TELEGRAM WEB APP SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        :root {
            --primary: #e8a838;
            --secondary: #8b78ff;
            --warning: #ffb547;
            --danger: #f44336;
            --dark: #090d19;
            --darker: #111a2c;
            --light: #f7f8fc;
            --gray: #9aa5bd;
            --success: #20c997;
            --gold: #ffd36a;
            --panel: rgba(20, 30, 51, .92);
            --line: rgba(255,255,255,.09);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(ellipse at 50% -15%, #29314d 0%, #101729 38%, var(--dark) 75%);
            color: var(--light);
            min-height: 100vh;
            padding-bottom: 80px;
            overflow-x: hidden;
            width: 100%;
        }
        
        .header {
            background: linear-gradient(135deg, rgba(25,36,61,.98), rgba(10,15,29,.96));
            padding: 28px 18px 30px;
            border: 1px solid var(--line);
            border-top: 0;
            border-radius: 0 0 28px 28px;
            text-align: center;
            position: relative;
            width: 100%;
        }
        
        .header h1 {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: -.5px;
            margin-bottom: 8px;
        }
        
        .header i {
            color: var(--gold);
            margin-right: 8px;
        }
        
        .header p {
            color: var(--gray);
            font-size: 13px;
        }
        
        .back-btn-header {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 22px;
            text-decoration: none;
            z-index: 10;
        }
        
        /* Refresh Indicator */
        .refresh-indicator {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--primary);
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 12px;
            transform: translateY(-100%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }
        .refresh-indicator.show {
            transform: translateY(0);
        }
        .refresh-indicator i {
            margin-right: 5px;
        }
        
        /* Stats Cards */
        .stats-container {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 15px;
            margin: 15px;
            background: var(--darker);
            border-radius: 20px;
        }
        
        .stat-item {
            flex: 1;
            text-align: center;
            background: rgba(255,255,255,0.05);
            padding: 12px 8px;
            border-radius: 15px;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: var(--gold);
        }
        
        .stat-label {
            font-size: 11px;
            color: var(--gray);
            margin-top: 5px;
        }
        
        .stat-help {
            font-size: 9px;
            color: var(--gray);
            margin-top: 3px;
            opacity: 0.7;
        }
        
        /* Main Reward Card */
        .reward-card {
            background: linear-gradient(135deg, var(--primary) 0%, #2E7D32 100%);
            border-radius: 25px;
            padding: 25px 20px;
            margin: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .reward-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: shimmer 3s infinite;
        }
        
        @keyframes shimmer {
            0% { transform: translate(-30%, -30%); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translate(30%, 30%); opacity: 0; }
        }
        
        .reward-card:hover {
            transform: scale(1.02);
        }
        
        .reward-card.disabled {
            background: linear-gradient(135deg, var(--gray) 0%, #666 100%);
            cursor: not-allowed;
            pointer-events: none;
            opacity: 0.8;
        }
        
        .reward-icon {
            font-size: 50px;
            margin-bottom: 10px;
        }
        
        .reward-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .reward-amount {
            font-size: 42px;
            font-weight: bold;
            color: var(--gold);
            margin-bottom: 5px;
        }
        
        .reward-coin {
            font-size: 13px;
            opacity: 0.9;
        }
        
        .streak-bonus-badge {
            display: inline-block;
            background: rgba(255,215,0,0.2);
            border-radius: 20px;
            padding: 5px 12px;
            margin-top: 10px;
            font-size: 11px;
        }
        
        /* Streak Info Section */
        .streak-info {
            background: linear-gradient(135deg, #ff6b6b20, #ffa50220);
            border-radius: 20px;
            padding: 15px;
            margin: 15px;
            border: 1px solid var(--gold);
        }
        
        .streak-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        
        .streak-fire {
            font-size: 40px;
        }
        
        .streak-info-text {
            flex: 1;
        }
        
        .streak-info-text h3 {
            font-size: 16px;
            margin-bottom: 3px;
        }
        
        .streak-info-text p {
            font-size: 11px;
            color: var(--gray);
        }
        
        .bonus-list {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        
        .bonus-chip {
            background: rgba(255,215,0,0.1);
            border-radius: 20px;
            padding: 6px 10px;
            font-size: 11px;
            border: 1px solid var(--gold);
        }
        
        .bonus-chip i {
            color: var(--gold);
            margin-right: 4px;
        }
        
        /* Calendar Section */
        .calendar-section {
            background: var(--darker);
            border-radius: 20px;
            padding: 15px;
            margin: 15px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .calendar-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .calendar-wrapper {
            overflow-x: auto;
            width: 100%;
        }
        
        .calendar {
            display: flex;
            gap: 8px;
            justify-content: space-between;
            min-width: 100%;
        }
        
        .calendar-day {
            flex: 1;
            min-width: 44px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 10px 4px;
            text-align: center;
            transition: all 0.2s ease;
        }
        
        .calendar-day .day-letter {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--gray);
        }
        
        .calendar-day .day-number {
            font-size: 16px;
            font-weight: bold;
        }
        
        .calendar-day i {
            font-size: 10px;
            margin-top: 4px;
            display: block;
        }
        
        .calendar-day.claimed {
            background: linear-gradient(135deg, var(--success), #008C4A);
        }
        
        .calendar-day.claimed .day-number {
            color: white;
        }
        
        .calendar-day.today {
            border: 2px solid var(--gold);
            background: rgba(255, 215, 0, 0.15);
        }
        
        .calendar-day.today .day-number {
            color: var(--gold);
        }
        
        /* Skeleton Loading Styles */
        .skeleton {
            background: linear-gradient(90deg, 
                rgba(255,255,255,0.05) 25%, 
                rgba(255,255,255,0.1) 50%, 
                rgba(255,255,255,0.05) 75%);
            background-size: 200% 100%;
            animation: skeleton-wave 1.5s infinite;
            border-radius: 8px;
        }
        
        @keyframes skeleton-wave {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        .skeleton-stat-item {
            flex: 1;
            text-align: center;
            background: rgba(255,255,255,0.05);
            padding: 12px 8px;
            border-radius: 15px;
        }
        .skeleton-stat-value {
            width: 40px;
            height: 28px;
            background: rgba(255,255,255,0.08);
            border-radius: 4px;
            margin: 0 auto;
        }
        .skeleton-stat-label {
            width: 50px;
            height: 11px;
            background: rgba(255,255,255,0.06);
            border-radius: 4px;
            margin: 8px auto 0;
        }
        
        .skeleton-reward-card {
            background: rgba(255,255,255,0.05);
            border-radius: 25px;
            padding: 25px 20px;
            margin: 15px;
            text-align: center;
        }
        .skeleton-reward-icon {
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
            margin: 0 auto 10px;
        }
        .skeleton-reward-title {
            width: 60%;
            height: 18px;
            background: rgba(255,255,255,0.08);
            border-radius: 4px;
            margin: 0 auto 8px;
        }
        .skeleton-reward-amount {
            width: 40%;
            height: 42px;
            background: rgba(255,255,255,0.08);
            border-radius: 4px;
            margin: 0 auto 5px;
        }
        .skeleton-reward-coin {
            width: 30%;
            height: 13px;
            background: rgba(255,255,255,0.06);
            border-radius: 4px;
            margin: 0 auto;
        }
        
        .skeleton-streak-info {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 15px;
            margin: 15px;
        }
        .skeleton-streak-fire {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
        }
        .skeleton-streak-text {
            flex: 1;
        }
        .skeleton-streak-title {
            width: 60%;
            height: 16px;
            background: rgba(255,255,255,0.08);
            border-radius: 4px;
            margin-bottom: 8px;
        }
        .skeleton-streak-subtitle {
            width: 40%;
            height: 11px;
            background: rgba(255,255,255,0.06);
            border-radius: 4px;
        }
        
        .skeleton-calendar {
            display: flex;
            gap: 8px;
            justify-content: space-between;
        }
        .skeleton-calendar-day {
            flex: 1;
            min-width: 44px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 10px 4px;
            text-align: center;
        }
        .skeleton-calendar-letter {
            width: 20px;
            height: 13px;
            background: rgba(255,255,255,0.08);
            border-radius: 4px;
            margin: 0 auto 6px;
        }
        .skeleton-calendar-number {
            width: 25px;
            height: 16px;
            background: rgba(255,255,255,0.08);
            border-radius: 4px;
            margin: 0 auto;
        }
        
        /* Countdown Timer */
        .countdown {
            text-align: center;
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 13px;
            color: var(--gray);
        }
        
        .countdown span {
            color: var(--gold);
            font-weight: bold;
            font-size: 16px;
        }
        
        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(12, 18, 32, .96);
            backdrop-filter: blur(16px);
            display: flex;
            padding: 8px 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }
        
        .nav-item {
            flex: 1;
            text-align: center;
            color: var(--gray);
            text-decoration: none;
            font-size: 11px;
            padding: 6px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        
        .nav-item i {
            font-size: 20px;
            display: block;
            margin-bottom: 3px;
        }
        
        .nav-item.active {
            color: var(--primary);
            background: rgba(76, 175, 80, 0.1);
        }
        
        .notification {
            position: fixed;
            bottom: 80px;
            left: 15px;
            right: 15px;
            background: var(--success);
            color: white;
            padding: 12px 18px;
            border-radius: 12px;
            text-align: center;
            font-weight: 500;
            display: none;
            z-index: 1000;
            font-size: 13px;
        }
        
        .notification.error {
            background: var(--danger);
        }
        
        .loading { text-align: center; padding: 30px; color: var(--gray); }

        /* Daily page visual refresh */
        .stats-container {
            margin: 18px 14px 14px;
            padding: 10px;
            gap: 8px;
            background: rgba(20,30,51,.72);
            border: 1px solid var(--line);
            box-shadow: 0 12px 30px rgba(0,0,0,.18);
        }
        .stat-item {
            background: transparent;
            padding: 10px 4px;
            min-width: 0;
        }
        .stat-value { font-size: clamp(22px, 6vw, 29px); color: var(--gold); }
        .stat-label { color: #dce2f1; font-size: 10px; font-weight: 700; }
        .stat-help { font-size: 9px; }
        .reward-card {
            margin: 14px;
            padding: 24px 18px 20px;
            border: 1px solid rgba(255,211,106,.36);
            border-radius: 25px;
            background: radial-gradient(circle at 50% 0%, rgba(255,211,106,.22), transparent 43%),
                        linear-gradient(145deg, #283653 0%, #17243d 58%, #10192c 100%);
            box-shadow: 0 18px 42px rgba(0,0,0,.28), inset 0 1px rgba(255,255,255,.08);
        }
        .reward-card::after {
            content: '';
            position: absolute;
            inset: 8px;
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 19px;
            pointer-events: none;
        }
        .reward-card:hover { transform: translateY(-2px); }
        .reward-card.disabled {
            background: linear-gradient(145deg, #273044, #171f31);
            border-color: rgba(255,255,255,.1);
            opacity: 1;
        }
        .reward-kicker {
            color: var(--gold);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 9px;
        }
        .reward-icon {
            display: inline-grid;
            place-items: center;
            width: 68px;
            height: 68px;
            margin: 0 auto 12px;
            border-radius: 22px;
            font-size: 38px;
            background: linear-gradient(145deg, rgba(255,211,106,.2), rgba(139,120,255,.14));
            border: 1px solid rgba(255,211,106,.25);
            box-shadow: 0 8px 25px rgba(0,0,0,.18);
        }
        .reward-title { font-size: 17px; letter-spacing: .1px; }
        .reward-amount { font-size: clamp(42px, 12vw, 54px); line-height: 1.05; margin: 10px 0 4px; color: #ffe09a; text-shadow: 0 3px 20px rgba(255,190,70,.18); }
        .reward-coin { color: #d3d9e8; font-size: 11px; font-weight: 800; letter-spacing: 2px; }
        .claim-hint { margin-top: 14px; color: #e7c77f; font-size: 11px; font-weight: 700; }
        .reward-breakdown {
            display: grid;
            grid-template-columns: repeat(2, minmax(0,1fr));
            gap: 8px;
            margin-top: 18px;
            text-align: left;
        }
        .breakdown-item {
            background: rgba(5,10,20,.28);
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 12px;
            padding: 9px 10px;
            min-width: 0;
        }
        .breakdown-item span { display:block; color:#aeb9ce; font-size:10px; margin-bottom:4px; }
        .breakdown-item strong { color:#fff; font-size:13px; }
        .streak-info {
            margin: 14px;
            padding: 17px;
            border: 1px solid rgba(139,120,255,.28);
            background: linear-gradient(145deg, rgba(49,43,86,.42), rgba(22,31,52,.88));
            box-shadow: 0 12px 28px rgba(0,0,0,.15);
        }
        .streak-fire { width:48px; height:48px; display:grid; place-items:center; border-radius:16px; background:rgba(255,181,71,.12); }
        .streak-info-text h3 { font-size:16px; }
        .bonus-chip { border-color:rgba(255,211,106,.3); background:rgba(255,211,106,.08); }
        .milestone-progress { margin-top:16px; padding:12px; border-radius:14px; background:rgba(5,10,20,.25); border:1px solid var(--line); }
        .milestone-progress-head { display:flex; justify-content:space-between; gap:8px; font-size:11px; margin-bottom:8px; }
        .milestone-progress-head strong { color:var(--gold); }
        .milestone-track { height:7px; background:rgba(255,255,255,.1); border-radius:20px; overflow:hidden; }
        .milestone-fill { height:100%; background:linear-gradient(90deg,#8b78ff,#ffd36a); border-radius:20px; }
        .calendar-section {
            margin: 14px;
            padding: 17px 14px;
            background: rgba(20,30,51,.78);
            border: 1px solid var(--line);
            box-shadow: 0 12px 28px rgba(0,0,0,.16);
        }
        .calendar-title { font-size:15px; }
        .calendar-day { border:1px solid rgba(255,255,255,.06); background:rgba(255,255,255,.035); min-width:39px; padding:11px 3px; }
        .calendar-day.claimed { background:linear-gradient(145deg,#167f69,#135c56); border-color:rgba(32,201,151,.38); }
        .calendar-day.today { border:1px solid var(--gold); box-shadow:0 0 0 2px rgba(255,211,106,.1); }
        .calendar-day.missed { opacity:.55; }
        .calendar-day .day-letter { font-size:10px; }
        .calendar-day .day-number { font-size:14px; }
        .countdown { border-color:var(--line); }
        .bottom-nav { border-color:var(--line); }
        .nav-item.active { color:var(--gold); background:rgba(255,211,106,.09); }
        @media (max-width: 360px) {
            .stats-container { gap:3px; padding:7px; }
            .stat-label { font-size:9px; }
            .reward-card { padding:21px 13px 17px; }
            .calendar-day { min-width:36px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .reward-card::before, .daily-celebration span { animation:none !important; }
            .reward-card, .calendar-day { transition:none; }
        }
        .daily-celebration { position: fixed; inset: 0; z-index: 2000; pointer-events: none; overflow: hidden; }
        .daily-celebration span { position: absolute; top: -45px; font-size: 32px; animation: daily-fall 1.5s ease-in forwards; }
        @keyframes daily-fall { to { transform: translateY(110vh) rotate(360deg); opacity: 0; } }
    </style>
</head>
<body>
    <!-- Refresh Indicator -->
    <div class="refresh-indicator" id="refreshIndicator">
        <i class="fas fa-arrow-down"></i> Pull to refresh
    </div>
    
    <a href="/" class="back-btn-header"><i class="fas fa-arrow-left"></i></a>
    
    <div class="header">
        <h1><i class="fas fa-calendar-check"></i> Daily Rewards</h1>
        <p>Login every day to earn COINS and build your streak!</p>
    </div>
    
    <!-- Stats Container - Will be populated by JS -->
    <div class="stats-container" id="statsContainer"></div>
    
    <!-- Main Reward Card - Will be populated by JS -->
    <div id="rewardCardContainer"></div>
    
    <!-- Streak Info Section - Will be populated by JS -->
    <div id="streakInfoContainer"></div>
    
    <!-- Calendar Section -->
    <div class="calendar-section">
        <div class="calendar-title">
            <i class="fas fa-calendar-alt"></i>
            <span>Last 7 Days</span>
        </div>
        <div class="calendar-wrapper">
            <div class="calendar" id="calendar">
                <div class="loading">Loading...</div>
            </div>
        </div>
        <div class="countdown" id="countdown">Next reward in: <span>--:--:--</span></div>
    </div>
    
    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <a href="/" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="/daily.html" class="nav-item active">
            <i class="fas fa-calendar-check"></i>
            <span>Daily</span>
        </a>
        <a href="/wheel.html" class="nav-item">
            <i class="fas fa-dharmachakra"></i>
            <span>Wheel</span>
        </a>
        <a href="/leaderboard.html" class="nav-item">
            <i class="fas fa-trophy"></i>
            <span>Ranks</span>
        </a>
        <a href="/team.html" class="nav-item">
            <i class="fas fa-users"></i>
            <span>Team</span>
        </a>
    </div>
    
    <div class="notification" id="notification"></div>
    
   <script>
    // ============================================
    // DAILY PAGE - WITH LOCAL DATE SUPPORT
    // ============================================
    
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
        console.log('✅ Daily page: Telegram WebApp ready');
    }
    
    let countdownInterval = null;
    let isRefreshing = false;
    let touchStartY = 0;
    const refreshIndicator = document.getElementById('refreshIndicator');
    
    function showNotification(msg, isError = false) {
        const notif = document.getElementById('notification');
        if (notif) {
            notif.textContent = msg;
            notif.className = 'notification' + (isError ? ' error' : '');
            notif.style.display = 'block';
            setTimeout(() => notif.style.display = 'none', 4000);
        }
    }
    
    async function apiCall(endpoint, data = null) {
        const options = {
            method: data ? 'POST' : 'GET',
            headers: { 'Content-Type': 'application/json' }
        };
        if (data) options.body = JSON.stringify(data);
        const response = await fetch(endpoint, options);
        if (!response.ok) {
            const error = await response.text();
            throw new Error(error);
        }
        return response.json();
    }
    
    function getLocalDate(date = new Date()) {
        return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
    }
    
    function calculateReward(streak, tier = 'Fresher') {
        const baseReward = 2, streakBonus = Math.max(0, streak || 0) * 0.5;
        const weeklyBonus = streak > 0 && streak % 7 === 0 ? 10 : 0;
        const milestoneBonus = streak === 30 ? 1000 : (streak === 100 ? 5000 : 0);
        const multipliers = { Fresher: 1, Brute: 1.5, Silver: 2, Gold: 2.5, Platinum: 3 };
        const multiplier = multipliers[tier] || 1;
        return { baseReward, streakBonus, weeklyBonus, milestoneBonus, multiplier,
            totalReward: (baseReward + streakBonus + weeklyBonus + milestoneBonus) * multiplier };
}
    
    function getRewardIcon(streak) {
        if (streak >= 100) return '💎';
        if (streak >= 50) return '👑';
        if (streak >= 30) return '⭐';
        if (streak >= 14) return '🌟';
        if (streak >= 7) return '🔥';
        return '🎁';
    }
    
    function getRewardTitle(streak, claimed) {
        if (claimed) return '✅ Already Claimed Today';
        if (streak >= 100) return '💎 LEGENDARY REWARD!';
        if (streak >= 50) return '👑 EPIC REWARD!';
        if (streak >= 30) return '⭐ AMAZING REWARD!';
        if (streak >= 14) return '🌟 GREAT REWARD!';
        if (streak >= 7) return '🔥 ON FIRE!';
        return '🎁 Claim Daily Reward';
    }
    
    function showSkeleton() {
        // Stats skeleton
        document.getElementById('statsContainer').innerHTML = `
            <div class="skeleton-stat-item">
                <div class="skeleton-stat-value"></div>
                <div class="skeleton-stat-label"></div>
            </div>
            <div class="skeleton-stat-item">
                <div class="skeleton-stat-value"></div>
                <div class="skeleton-stat-label"></div>
            </div>
            <div class="skeleton-stat-item">
                <div class="skeleton-stat-value"></div>
                <div class="skeleton-stat-label"></div>
            </div>
        `;
        document.getElementById('rewardCardContainer').innerHTML = `
            <div class="skeleton-reward-card">
                <div class="skeleton-reward-icon"></div>
                <div class="skeleton-reward-title"></div>
                <div class="skeleton-reward-amount"></div>
                <div class="skeleton-reward-coin"></div>
            </div>
        `;
        document.getElementById('streakInfoContainer').innerHTML = `
    <div class="streak-info">
        <div class="streak-header">
            <div class="streak-fire">🔥</div>
            <div class="streak-info-text">
                <h3>How Streak Works</h3>
                <p>Claim daily without missing a day to increase your streak!</p>
            </div>
        </div>
        <div class="bonus-list">
            <div class="bonus-chip"><i class="fas fa-chart-line"></i> +0.5/day</div>
            <div class="bonus-chip"><i class="fas fa-calendar-week"></i> +10 every 7 days</div>
            <div class="bonus-chip"><i class="fas fa-crown"></i> 30 days: +1000</div>
            <div class="bonus-chip"><i class="fas fa-gem"></i> 100 days: +5000</div>
        </div>
    </div> 
`;
        const calendar = document.getElementById('calendar');
        if (calendar) {
            calendar.innerHTML = `
                <div class="skeleton-calendar">
                    <div class="skeleton-calendar-day"><div class="skeleton-calendar-letter"></div><div class="skeleton-calendar-number"></div></div>
                    <div class="skeleton-calendar-day"><div class="skeleton-calendar-letter"></div><div class="skeleton-calendar-number"></div></div>
                    <div class="skeleton-calendar-day"><div class="skeleton-calendar-letter"></div><div class="skeleton-calendar-number"></div></div>
                    <div class="skeleton-calendar-day"><div class="skeleton-calendar-letter"></div><div class="skeleton-calendar-number"></div></div>
                    <div class="skeleton-calendar-day"><div class="skeleton-calendar-letter"></div><div class="skeleton-calendar-number"></div></div>
                    <div class="skeleton-calendar-day"><div class="skeleton-calendar-letter"></div><div class="skeleton-calendar-number"></div></div>
                    <div class="skeleton-calendar-day"><div class="skeleton-calendar-letter"></div><div class="skeleton-calendar-number"></div></div>
                </div>
            `;
        }
    }
    
    function updateDailyUI(data) {
    // ✅ FIX: Show last known streak when not yet claimed today
    let displayStreak = data.current_streak || 0;
    const claimedToday = data.claimed_today || false;
    

    document.getElementById('statsContainer').innerHTML = `
        <div class="stat-item">
            <div class="stat-value" id="streakCount">${displayStreak}</div>
            <div class="stat-label">Current Streak 🔥</div>
            <div class="stat-help">Days in a row</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="maxStreak">${data.max_streak || 0}</div>
            <div class="stat-label">Best Streak 🏆</div>
            <div class="stat-help">Your highest ever</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="totalDays">${data.total_claims || 0}</div>
            <div class="stat-label">Total Days</div>
            <div class="stat-help">Lifetime claims</div>
        </div>
    `;
    
    const nextStreak = claimedToday ? displayStreak : (data.current_streak > 0 ? data.current_streak + 1 : 1);
    const reward = calculateReward(nextStreak, data.tier || 'Fresher');
    const nextMilestone = nextStreak < 30 ? 30 : (nextStreak < 100 ? 100 : 100);
    const daysToMilestone = Math.max(0, nextMilestone - nextStreak);
    const milestoneProgress = Math.min(100, Math.round((nextStreak / nextMilestone) * 100));
    document.getElementById('rewardCardContainer').innerHTML = `
        <div class="reward-card" id="claimBtn" role="button" tabindex="0" aria-label="${claimedToday ? 'Daily reward already claimed' : 'Claim daily reward'}">
            <div class="reward-kicker">${claimedToday ? 'DAILY REWARD COLLECTED' : 'YOUR DAILY BONUS IS READY'}</div>
            <div class="reward-icon" id="rewardIcon">${getRewardIcon(nextStreak)}</div>
            <div class="reward-title" id="claimBtnText">${getRewardTitle(nextStreak, claimedToday)}</div>
            <div class="reward-amount"><span id="todayReward">${reward.totalReward.toFixed(2)}</span></div>
            <div class="reward-coin">COINS ${claimedToday ? 'EARNED TODAY' : 'AVAILABLE TO CLAIM'}</div>
            <div class="claim-hint">${claimedToday ? 'Come back tomorrow to keep your streak alive' : 'TAP ANYWHERE ON THIS CARD TO CLAIM'}</div>
            <div class="reward-breakdown">
                <div class="breakdown-item"><span>Base reward</span><strong>+2 coins</strong></div>
                <div class="breakdown-item"><span>Streak bonus</span><strong>+${reward.streakBonus.toFixed(1)} coins</strong></div>
                <div class="breakdown-item"><span>Weekly bonus</span><strong>+${reward.weeklyBonus} coins</strong></div>
                <div class="breakdown-item"><span>Milestone bonus</span><strong>+${reward.milestoneBonus.toLocaleString()} coins</strong></div>
                <div class="breakdown-item" style="grid-column:1/-1"><span>Your tier multiplier</span><strong>${reward.multiplier}x · Total ${reward.totalReward.toLocaleString(undefined,{maximumFractionDigits:2})} coins</strong></div>
            </div>
        </div>
    `;
    
    document.getElementById('streakInfoContainer').innerHTML = `
    <div class="streak-info">
        <div class="streak-header">
            <div class="streak-fire">🔥</div>
            <div class="streak-info-text">
                <h3>How Streak Works</h3>
                <p>Claim daily without missing a day to increase your streak!</p>
            </div>
        </div>
        <div class="bonus-list">
            <div class="bonus-chip"><i class="fas fa-chart-line"></i> +0.5 per streak day</div>
            <div class="bonus-chip"><i class="fas fa-calendar-week"></i> +10 every 7 days</div>
            <div class="bonus-chip"><i class="fas fa-crown"></i> 30 days: +1,000</div>
            <div class="bonus-chip"><i class="fas fa-gem"></i> 100 days: +5,000</div>
        </div>
        <div class="milestone-progress">
            <div class="milestone-progress-head"><span>Next milestone</span><strong>${nextMilestone} days · ${daysToMilestone} to go</strong></div>
            <div class="milestone-track"><div class="milestone-fill" style="width:${milestoneProgress}%"></div></div>
        </div>
    </div>
`;
    
    const claimBtn = document.getElementById('claimBtn');
    if (claimBtn) {
        if (claimedToday) {
            claimBtn.classList.add('disabled');
        } else {
            claimBtn.classList.remove('disabled');
        }
        // Remove old listener to prevent duplicates
        const newBtn = claimBtn.cloneNode(true);
        claimBtn.parentNode.replaceChild(newBtn, claimBtn);
        newBtn.addEventListener('click', claimDailyReward);
    }
    
    renderCalendar(data);
}
    
    function renderCalendar(data) {
        const calendar = document.getElementById('calendar');
        if (!calendar) return;
        
        const todayStr = getLocalDate();
        const claimedDays = data?.last_7_days || [];
        const claimedDates = new Set(claimedDays.map(d => d.reward_date));
        
        const startDate = new Date();
        startDate.setHours(12, 0, 0, 0);
        startDate.setDate(startDate.getDate() - 6);
        
        calendar.innerHTML = '';
        const dayNames = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
        
        for (let i = 0; i < 7; i++) {
            const date = new Date(startDate);
            date.setDate(startDate.getDate() + i);
            const dateStr = getLocalDate(date);
            const dayLetter = dayNames[date.getDay()];
            const dayNumber = date.getDate();
            const month = date.getMonth() + 1;
            const isClaimed = claimedDates.has(dateStr);
            const isToday = dateStr === todayStr;
            
            const dayDiv = document.createElement('div');
            dayDiv.className = `calendar-day ${isClaimed ? 'claimed' : ''} ${isToday ? 'today' : ''}`;
            let checkIcon = '';
            if (isClaimed) checkIcon = '<i class="fas fa-check-circle"></i>';
            else if (isToday && !isClaimed) checkIcon = '<i class="fas fa-gift"></i>';
            else if (dateStr < todayStr) dayDiv.classList.add('missed');
            dayDiv.innerHTML = `<div class="day-letter">${dayLetter}</div><div class="day-number">${dayNumber}/${month}</div>${checkIcon}`;
            calendar.appendChild(dayDiv);
        }
    }
    
    function startCountdown() {
        if (countdownInterval) clearInterval(countdownInterval);
        countdownInterval = setInterval(() => {
            const now = new Date();
            const tomorrow = new Date(now);
            tomorrow.setDate(now.getDate() + 1);
            tomorrow.setHours(0, 0, 0, 0);
            const diff = tomorrow - now;
            if (diff <= 0) {
                loadDailyStats(false);
                return;
            }
            const hours = Math.floor(diff / 3600000);
            const minutes = Math.floor((diff % 3600000) / 60000);
            const seconds = Math.floor((diff % 60000) / 1000);
            const countdownEl = document.getElementById('countdown');
            if (countdownEl) {
                countdownEl.innerHTML = `Next reward in: <span>${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}</span>`;
            }
        }, 1000);
    }
    
    async function loadDailyStats(showSkeletonLoader = true) {
        if (!tg?.initData) {
            showNotification('Please open from Telegram', true);
            return;
        }
        if (showSkeletonLoader) showSkeleton();
        try {
            const localDate = getLocalDate();
            const data = await apiCall('/api/daily-stats', { initData: tg.initData, localDate });
            updateDailyUI(data);
            startCountdown();
            return true;
        } catch (err) {
            console.error('Failed to load daily stats:', err);
            document.getElementById('statsContainer').innerHTML = '<div class="loading">Failed to load stats</div>';
            return false;
        }
    }
    
   async function claimDailyReward() {
    if (!tg?.initData) {
        showNotification('Please open from Telegram', true);
        return;
    }
    const claimBtn = document.getElementById('claimBtn');
    if (claimBtn.classList.contains('disabled')) {
        showNotification('You already claimed your reward today! Come back tomorrow!', true);
        return;
    }
    claimBtn.style.transform = 'scale(0.98)';
    setTimeout(() => claimBtn.style.transform = '', 200);
    claimBtn.style.pointerEvents = 'none';
    claimBtn.style.opacity = '0.7';
    
    try {
        const localDate = getLocalDate();
        const data = await apiCall('/api/daily-reward', { initData: tg.initData, localDate });
        const coins = Number(data.reward).toFixed(2);
        const newStreak = data.streak;
        celebrateDailyReward(newStreak);
        let message = `🎁 Daily reward claimed! +${coins} COINS! Streak: ${newStreak} days 🔥`;
        if (data.milestoneBonus > 0) message += ` Milestone bonus included: +${Number(data.milestoneBonus).toFixed(2)} coins!`;
        if (newStreak >= 100) message = `💎 LEGENDARY! ${newStreak} day streak! +${coins} COINS! 💎`;
        else if (newStreak >= 50) message = `👑 EPIC! ${newStreak} day streak! +${coins} COINS! 👑`;
        else if (newStreak >= 30) message = `⭐ AMAZING! ${newStreak} day streak! +${coins} COINS! ⭐`;
        else if (newStreak >= 14) message = `🌟 GREAT! ${newStreak} day streak! +${coins} COINS! 🌟`;
        else if (newStreak >= 7) message = `🔥 ON FIRE! ${newStreak} day streak! +${coins} COINS! 🔥`;
        showNotification(message);
        
        // ✅ Force reload stats after claiming
        await loadDailyStats(false);
        
    } catch (err) {
        let errorMsg = err.message;
        try { const parsed = JSON.parse(errorMsg); errorMsg = parsed.error || errorMsg; } catch (e) {}
        if (errorMsg.includes('Already claimed')) errorMsg = 'You already claimed your reward today! Come back tomorrow!';
        showNotification(errorMsg, true);
        await loadDailyStats(false);
    } finally {
        claimBtn.style.pointerEvents = '';
        claimBtn.style.opacity = '';
    }
}
    
    function celebrateDailyReward(streak) {
        const layer = document.createElement('div'); layer.className = 'daily-celebration';
        const symbols = streak === 100 ? ['💎','✨','🏆'] : streak === 30 ? ['⭐','🎉','🏆'] : streak % 7 === 0 ? ['🔥','✨','🎉'] : ['🎉','✨','🪙'];
        symbols.forEach((symbol, index) => { const piece = document.createElement('span'); piece.textContent = symbol; piece.style.left = (15 + index * 30) + '%'; piece.style.animationDelay = (index * 100) + 'ms'; layer.appendChild(piece); });
        document.body.appendChild(layer); setTimeout(() => layer.remove(), 1800);
    }

    // Pull to refresh
    function showRefreshIndicator(text, isError = false) {
        refreshIndicator.innerHTML = text;
        refreshIndicator.style.background = isError ? 'var(--danger)' : 'var(--primary)';
        refreshIndicator.classList.add('show');
        setTimeout(() => refreshIndicator.classList.remove('show'), 1500);
    }
    async function refreshData() {
        if (isRefreshing) return;
        isRefreshing = true;
        showRefreshIndicator('<i class="fas fa-spinner fa-spin"></i> Refreshing...');
        try {
            const loaded = await loadDailyStats(false);
            if (!loaded) throw new Error('Refresh failed');
            showRefreshIndicator('<i class="fas fa-check-circle"></i> Updated!');
            showNotification('Daily stats refreshed!', false);
        } catch (err) {
            showRefreshIndicator('<i class="fas fa-exclamation-circle"></i> Failed to refresh', true);
        } finally {
            isRefreshing = false;
        }
    }
    document.addEventListener('touchstart', (e) => { if (window.scrollY === 0) touchStartY = e.touches[0].clientY; });
    document.addEventListener('touchmove', (e) => {
        if (window.scrollY === 0 && !isRefreshing) {
            const diff = e.touches[0].clientY - touchStartY;
            if (diff > 60) { e.preventDefault(); refreshData(); }
        }
    });
    document.addEventListener('DOMContentLoaded', () => { loadDailyStats(true); });
</script>
